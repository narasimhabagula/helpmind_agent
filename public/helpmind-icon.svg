<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#334155" stroke-width="1.5"/>

  <!-- Chat Bubble Outer Stroke -->
  <path d="M32 10C20.4 10 11 18.5 11 29c0 5.4 2.5 10.3 6.6 13.8L15 51l8.5-3.8c2.6 1.2 5.5 1.8 8.5 1.8 11.6 0 21-8.5 21-19S43.6 10 32 10z" 
        stroke="url(#glow-grad)" stroke-width="2.5" fill="#0f172a" fill-opacity="0.8" stroke-linejoin="round" filter="url(#neon-glow)"/>

  <!-- Neural Network Nodes & Synapses (Brain Shape) -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.85">
    <line x1="26" y1="22" x2="32" y2="19"/>
    <line x1="32" y1="19" x2="38" y2="22"/>
    <line x1="26" y1="22" x2="22" y2="27"/>
    <line x1="38" y1="22" x2="42" y2="27"/>
    <line x1="22" y1="27" x2="27" y2="33"/>
    <line x1="42" y1="27" x2="37" y2="33"/>
    <line x1="27" y1="33" x2="32" y2="27"/>
    <line x1="37" y1="33" x2="32" y2="27"/>
    <line x1="32" y1="19" x2="32" y2="27"/>
    <line x1="26" y1="22" x2="32" y2="27"/>
    <line x1="38" y1="22" x2="32" y2="27"/>
    <line x1="27" y1="33" x2="32" y2="37"/>
    <line x1="37" y1="33" x2="32" y2="37"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="32" cy="19" r="2.2" fill="#67e8f9"/>
  <circle cx="26" cy="22" r="2" fill="#38bdf8"/>
  <circle cx="38" cy="22" r="2" fill="#38bdf8"/>
  <circle cx="22" cy="27" r="1.8" fill="#60a5fa"/>
  <circle cx="42" cy="27" r="1.8" fill="#60a5fa"/>
  <circle cx="32" cy="27" r="2.6" fill="#ffffff" filter="url(#neon-glow)"/>
  <circle cx="27" cy="33" r="1.8" fill="#34d399"/>
  <circle cx="37" cy="33" r="1.8" fill="#34d399"/>
  <circle cx="32" cy="37" r="2" fill="#67e8f9"/>
</svg>
